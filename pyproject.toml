[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sgw-resilience"
version = "1.0.0"
description = "Two human-reviewed infrastructure resilience workflows for the AECOM case"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3", "httpx>=0.27,<1",
  "numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn==1.8.0",
  "joblib>=1.4,<2", "pyyaml>=6,<7", "rank-bm25==0.2.2"
]

[project.optional-dependencies]
rag = ["chromadb>=1,<2", "sentence-transformers>=3.3,<6"]
ui = ["streamlit>=1.66,<2", "plotly>=5.24,<7", "pydeck>=0.9,<1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL", "rag: requires downloaded retrieval models"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
