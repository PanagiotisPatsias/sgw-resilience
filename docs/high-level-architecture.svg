<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">SGW Resilience — High-Level Architecture</title>
<desc id="description">Streamlit calls a modular FastAPI backend. Synthetic source fixtures and telemetry batches enter the API. Weather, condition, decision and leadership modules read and write PostgreSQL. Raw telemetry is evaluated in memory; window results are stored. Local retrieval uses versioned playbooks, Chroma, embeddings and a reranker. The anomaly model loads saved artifacts. Drafts and briefings use the external OpenAI API. Tasks require human approval.</desc>
