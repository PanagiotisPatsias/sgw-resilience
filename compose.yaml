services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sgw
      POSTGRES_DB: sgw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgw_local_password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgw -d sgw"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://sgw:${POSTGRES_PASSWORD:-sgw_local_password}@postgres:5432/sgw
      HF_HOME: /opt/models
      CHROMA_PATH: /code/runtime/chroma
    volumes:
      - api-runtime:/code/runtime
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.ui
    env_file: .env
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:8502:8501"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  api-runtime:
