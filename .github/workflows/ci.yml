name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sgw
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: sgw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgw -d sgw_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sgw:test-password@localhost:5432/sgw_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install '.[ui,dev]'
      - run: ruff check app scripts tests ui
      - run: ruff format --check app scripts tests ui
      - run: python -m scripts.train_autoencoder
      - run: pytest -q
  hybrid-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: sentence-models-minilm-v1
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install '.[rag,dev]'
      - run: RUN_RAG_TESTS=1 pytest -q tests/test_retrieval.py
      - run: python -m scripts.evaluate_rag
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: artifacts/rag_evaluation.json
